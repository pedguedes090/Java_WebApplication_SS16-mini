<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quản trị viên</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .top-nav {
            background-color: #333;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .top-nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #4CAF50;
        }
        .header {
            background-color: #333;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stats-card {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stats-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .stats-value {
            font-size: 32px;
            color: #4CAF50;
            font-weight: bold;
        }
        .section-title {
            font-size: 20px;
            color: #333;
            margin: 20px 0 15px 0;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .products-table {
            width: 100%;
            background-color: white;
            border-collapse: collapse;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .products-table th {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: left;
        }
        .products-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        .products-table tr:hover {
            background-color: #f9f9f9;
        }
        .rank {
            font-weight: bold;
            color: #4CAF50;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            background-color: #e8f5e9;
            border-radius: 50%;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <a href="/">Trang chủ</a>
        <a href="/admin/categories">Quản lý danh mục</a>
        <a href="/admin/products">Quản lý sản phẩm</a>
        <a href="/admin/dashboard">Dashboard</a>
    </div>

    <div class="header">
        <h1>Bảng điều khiển quản trị</h1>
        <p>Thống kê doanh thu và sản phẩm bán chạy</p>
    </div>

    <div class="dashboard-grid">
        <div class="stats-card">
            <h2>Tổng doanh thu</h2>
            <div class="stats-value" th:text="${'₫' + #numbers.formatDecimal(totalRevenue, 0, 'DEFAULT', 0, 'DEFAULT')}"></div>
        </div>
        <div class="stats-card">
            <h2>Sản phẩm bán chạy nhất</h2>
            <div class="stats-value" th:text="${bestSellingProducts.size() > 0 ? bestSellingProducts.get(0).name : 'Không có'}"></div>
        </div>
    </div>

    <h2 class="section-title">5 Sản phẩm bán chạy nhất</h2>
    <table class="products-table" th:if="${bestSellingProducts.size() > 0}">
        <thead>
        <tr>
            <th>Xếp hạng</th>
            <th>Tên sản phẩm</th>
            <th>Danh mục</th>
            <th>Giá</th>
            <th>Số lượng bán</th>
            <th>Tồn kho</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product, stat : ${bestSellingProducts}">
            <td><div class="rank" th:text="${stat.count}"></div></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.category.name}"></td>
            <td th:text="${'₫' + #numbers.formatDecimal(product.price, 0, 'DEFAULT', 0, 'DEFAULT')}"></td>
            <td th:text="${product.soldQuantity}"></td>
            <td th:text="${product.stock}"></td>
        </tr>
        </tbody>
    </table>

    <div th:if="${bestSellingProducts.size() == 0}" class="no-data">
        <p>Chưa có dữ liệu bán hàng</p>
    </div>
</div>
</body>
</html>
