<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #0275d8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0275d8;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0275d8;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #0275d9;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .form-footer p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .form-footer a {
            color: #0275d8;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .form-footer a:hover {
            color: #0275d9;
        }
        .back-home {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .back-home:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>Cửa hàng</h1>
        <p>Đăng nhập để tiếp tục mua sắm</p>
    </div>

    <div th:if="${param.success}" class="success-message">
        Đăng ký thành công! Vui lòng đăng nhập với tài khoản của bạn.
    </div>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:action="@{/auth/login}" method="post">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="${loginDTO?.email}"
                   required placeholder="Nhập email của bạn">
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password"
                   required placeholder="Nhập mật khẩu của bạn">
        </div>

        <button type="submit" class="btn">Đăng nhập</button>
    </form>

    <div class="form-footer">
        <p>Chưa có tài khoản?</p>
        <a href="/auth/register">Đăng ký ngay</a>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/" class="back-home">← Quay lại trang chủ</a>
    </div>
</div>
</body>
</html>
