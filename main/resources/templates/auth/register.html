<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #0275d8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: bold;
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0275d8;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0275d8;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #5568d3;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            font-size: 13px;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .form-footer p {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .form-footer a {
            color: #0275d8;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .form-footer a:hover {
            color: #0275d9;
        }
        .back-home {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 13px;
            margin-top: 15px;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .back-home:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>Cửa hàng</h1>
        <p>Tạo tài khoản để bắt đầu mua sắm</p>
    </div>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:action="@{/auth/register}" method="post">
        <div class="form-group">
            <label for="name">Họ và tên:</label>
            <input type="text" id="name" name="name" th:value="${registerDTO?.name}"
                   required placeholder="Nhập họ và tên của bạn">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="${registerDTO?.email}"
                   required placeholder="Nhập email của bạn">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password"
                       required placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu:</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       required placeholder="Xác nhận mật khẩu">
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" th:value="${registerDTO?.phone}"
                   required placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label for="address">Địa chỉ:</label>
            <input type="text" id="address" name="address" th:value="${registerDTO?.address}"
                   required placeholder="Nhập địa chỉ của bạn">
        </div>

        <button type="submit" class="btn">Đăng ký</button>
    </form>

    <div class="form-footer">
        <p>Đã có tài khoản?</p>
        <a href="/auth/login">Đăng nhập ngay</a>
    </div>

    <div style="text-align: center; margin-top: 15px;">
        <a href="/" class="back-home">← Quay lại trang chủ</a>
    </div>
</div>
</body>
</html>
