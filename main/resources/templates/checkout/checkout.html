<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .top-nav {
            background-color: #333;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .top-nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .top-nav a:hover {
            color: #4CAF50;
        }
        .header {
            background-color: #333;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .checkout-form {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        .form-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .form-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .order-summary {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
        }
        .order-summary h2 {
            margin-bottom: 15px;
            color: #333;
        }
        .order-items {
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
        }
        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
            .order-summary {
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <a href="/">Trang chủ</a>
        <a href="/products">Danh sách sản phẩm</a>
        <a href="/cart">Giỏ hàng</a>
    </div>

    <div class="header">
        <h1>Thanh toán</h1>
    </div>

    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <div class="checkout-container">
        <form method="post" action="/checkout/submit" class="checkout-form">
            <div class="form-section">
                <h3>Thông tin khách hàng</h3>
                <div class="form-group">
                    <label for="name">Họ và tên *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Điện thoại *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Địa chỉ *</label>
                    <input type="text" id="address" name="address" required>
                </div>
            </div>

            <div class="form-section">
                <h3>Thông tin giao hàng</h3>
                <div class="form-group">
                    <label for="recipientName">Người nhận *</label>
                    <input type="text" id="recipientName" name="recipientName" required>
                </div>
                <div class="form-group">
                    <label for="recipientPhone">Điện thoại người nhận *</label>
                    <input type="tel" id="recipientPhone" name="recipientPhone" required>
                </div>
                <div class="form-group">
                    <label for="recipientAddress">Địa chỉ giao hàng *</label>
                    <input type="text" id="recipientAddress" name="recipientAddress" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Xác nhận đặt hàng</button>
        </form>

        <div class="order-summary">
            <h2>Tóm tắt đơn hàng</h2>
            <div class="order-items">
                <div th:each="item : ${cartItems}" class="order-item">
                    <span>
                        <span th:text="${item.productName}"></span> x <span th:text="${item.quantity}"></span>
                    </span>
                    <span th:text="${'₫' + #numbers.formatDecimal(item.totalPrice, 0, 'DEFAULT', 0, 'DEFAULT')}"></span>
                </div>
            </div>
            <div class="order-total">
                <span>Tổng cộng:</span>
                <span th:text="${'₫' + #numbers.formatDecimal(totalPrice, 0, 'DEFAULT', 0, 'DEFAULT')}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
