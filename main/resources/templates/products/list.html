<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #333;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .header h1 {
            margin-bottom: 10px;
        }
        .search-form {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .search-form input, .search-form select {
            padding: 8px 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .search-form button {
            padding: 8px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .search-form button:hover {
            background-color: #45a049;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-card h3 {
            margin: 10px 0;
            color: #333;
            height: 10px;
        }
        .product-card .price {
            font-size: 18px;
            color: #d9534f;
            font-weight: bold;
            margin: 10px 0;
        }
        .product-card .stock {
            font-size: 12px;
            color: #777;
            margin: 5px 0;
        }
        .add-to-cart-form {
            margin-top: auto;
        }
        .add-to-cart-form input {
            width: 50px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .add-to-cart-form button {
            width: 100%;
            padding: 8px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 5px;
        }
        .add-to-cart-form button:hover {
            background-color: #4cae4c;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination a, .pagination span {
            padding: 8px 12px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 3px;
            text-decoration: none;
            color: #333;
        }
        .pagination a:hover {
            background-color: #f0f0f0;
        }
        .pagination .active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .top-nav {
            background-color: #333;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .top-nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .top-nav a:hover {
            color: #4CAF50;
        }
        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <a href="/">Trang chủ</a>
        <a href="/cart">Giỏ hàng</a>
    </div>

    <div class="header">
        <h1>Cửa hàng trực tuyến</h1>
        <p>Tìm kiếm và mua sắm sản phẩm yêu thích của bạn</p>
    </div>

    <div th:if="${success}" class="message success" th:text="${success}"></div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <div class="search-form">
        <form method="get" action="/products">
            <input type="text" name="name" placeholder="Tên sản phẩm" th:value="${searchDTO.name}">
            <input type="number" name="minPrice" placeholder="Giá từ" step="0.01" th:value="${searchDTO.minPrice}">
            <input type="number" name="maxPrice" placeholder="Giá đến" step="0.01" th:value="${searchDTO.maxPrice}">
            <select name="categoryId">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${searchDTO.categoryId == cat.id}"></option>
            </select>
            <button type="submit">Tìm kiếm</button>
        </form>
    </div>

    <div class="products-grid">
        <div th:each="product : ${products}" class="product-card">
            <h3 th:text="${product.name}"></h3>
            <p class="price" th:text="${'₫' + #numbers.formatDecimal(product.price, 0, 'DEFAULT', 0, 'DEFAULT')}"></p>
            <p class="stock" th:if="${product.stock > 0}" th:text="${'Còn ' + product.stock + ' sản phẩm'}"></p>
            <p class="stock" th:if="${product.stock == 0}" style="color: red;" th:text="'Hết hàng'"></p>

            <form th:if="${product.stock > 0}" method="post" action="/cart/add" class="add-to-cart-form">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                <button type="submit">Thêm vào giỏ</button>
            </form>
            <button th:if="${product.stock == 0}" disabled style="background-color: #ccc; cursor: not-allowed; width: 100%; padding: 8px; border: none; border-radius: 3px;">Hết hàng</button>
        </div>
    </div>

    <div class="pagination">
        <a th:if="${currentPage > 0}" th:href="${'/products?page=0&name=' + (searchDTO.name ?: '') + '&minPrice=' + (searchDTO.minPrice ?: '') + '&maxPrice=' + (searchDTO.maxPrice ?: '') + '&categoryId=' + (searchDTO.categoryId ?: '')}">« Đầu</a>
        <a th:if="${currentPage > 0}" th:href="${'/products?page=' + (currentPage - 1) + '&name=' + (searchDTO.name ?: '') + '&minPrice=' + (searchDTO.minPrice ?: '') + '&maxPrice=' + (searchDTO.maxPrice ?: '') + '&categoryId=' + (searchDTO.categoryId ?: '')}">‹ Trước</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:if="${i >= currentPage - 2 && i <= currentPage + 2}">
            <a th:if="${i != currentPage}"
               th:href="${'/products?page=' + i + '&name=' + (searchDTO.name ?: '') + '&minPrice=' + (searchDTO.minPrice ?: '') + '&maxPrice=' + (searchDTO.maxPrice ?: '') + '&categoryId=' + (searchDTO.categoryId ?: '')}"
               th:text="${i + 1}"></a>
            <span th:if="${i == currentPage}" class="active" th:text="${i + 1}"></span>
        </span>

        <a th:if="${currentPage < totalPages - 1}" th:href="${'/products?page=' + (currentPage + 1) + '&name=' + (searchDTO.name ?: '') + '&minPrice=' + (searchDTO.minPrice ?: '') + '&maxPrice=' + (searchDTO.maxPrice ?: '') + '&categoryId=' + (searchDTO.categoryId ?: '')}">Sau ›</a>
        <a th:if="${currentPage < totalPages - 1}" th:href="${'/products?page=' + (totalPages - 1) + '&name=' + (searchDTO.name ?: '') + '&minPrice=' + (searchDTO.minPrice ?: '') + '&maxPrice=' + (searchDTO.maxPrice ?: '') + '&categoryId=' + (searchDTO.categoryId ?: '')}">Cuối »</a>
    </div>
</div>
</body>
</html>
