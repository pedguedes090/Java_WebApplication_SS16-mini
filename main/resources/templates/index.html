<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng trực tuyến</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .top-nav {
            background-color: #333;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .top-nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 3px;
            display: inline-block;
        }
        .top-nav a:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }
        .banner {
            background-color: #333;
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 40px;
        }
        .banner h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }
        .banner p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 3px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #f0f0f0;
        }
        .section-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-card h3 {
            height: 25px;
            margin: 10px 0;
            color: #333;
        }
        .product-card .price {
            font-size: 18px;
            color: #d9534f;
            font-weight: bold;
            margin: 10px 0;
        }
        .product-card .stock {
            font-size: 12px;
            color: #777;
            margin: 5px 0;
        }
        .quick-add-btn {
            margin-top: auto;
            width: 100%;
            padding: 8px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .quick-add-btn:hover {
            background-color: #4cae4c;
        }
        .footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <div>
            <a href="/">Trang chủ</a>
            <a href="/products">Danh sách sản phẩm</a>
            <a href="/cart">Giỏ hàng</a>
        </div>
        <div>
            <a th:if="${session.userRole} == 'ADMIN'" href="/admin/dashboard" style="margin-left: auto; margin-right: 10px;">Quản lý</a>
            <span th:if="${session.userName} != null" style="color: white; margin-right: 15px; display: inline-block;">
            Xin chào, <strong th:text="${session.userName}"></strong>
        </span>
            <a th:if="${session.userName} != null" href="/auth/logout" style="background-color: #d9534f; padding: 8px 15px; border-radius: 3px; display: inline-block;">Đăng xuất</a>
            <a th:if="${session.userName} == null" href="/auth/login" style="background-color: #5cb85c; padding: 8px 15px; border-radius: 3px; display: inline-block; margin-right: 5px;">Đăng nhập</a>
            <a th:if="${session.userName} == null" href="/auth/register" style="background-color: #0275d8; padding: 8px 15px; border-radius: 3px; display: inline-block;">Đăng ký</a>
        </div>
    </div>

    <div class="banner">
        <h1>Chào mừng đến cửa hàng trực tuyến</h1>
        <p>Khám phá hàng ngàn sản phẩm chất lượng cao với giá cạnh tranh</p>
    </div>

    <h2 class="section-title">Sản phẩm nổi bật</h2>
    <div class="products-grid">
        <div th:each="product : ${recentProducts}" class="product-card">
            <h3 th:text="${product.name}"></h3>
            <p class="price" th:text="${'₫' + #numbers.formatDecimal(product.price, 0, 'DEFAULT', 0, 'DEFAULT')}"></p>
            <p class="stock" th:if="${product.stock > 0}" th:text="${'Còn ' + product.stock + ' sản phẩm'}"></p>
            <p class="stock" th:if="${product.stock == 0}" style="color: red;" th:text="'Hết hàng'"></p>
            <a href="/products" class="quick-add-btn">Xem chi tiết</a>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Cửa hàng trực tuyến. Tất cả quyền được bảo lưu.</p>
    </div>
</div>
</body>
</html>
